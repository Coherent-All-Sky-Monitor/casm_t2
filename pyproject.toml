[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "casm-t2"
version = "0.1.0"
description = "CASM T2: real-time candidate ingest, filtering and dump triggering"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "scikit-learn",
]

[project.scripts]
t2d = "casm_t2.apps.t2d:main"
t2-inject = "casm_t2.apps.inject_daemon:main"
t2-inject-report = "casm_t2.apps.inject_report:main"
t2-replay = "casm_t2.apps.replay:main"
t2-source-watch = "casm_t2.apps.source_watch:main"
t2-transit-schedule = "casm_t2.apps.transit_schedule:main"
t2-dump = "casm_t2.dump_client:main"

[tool.setuptools.packages.find]
include = ["casm_t2*"]
