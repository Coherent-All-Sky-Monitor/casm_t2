# t2d — the one config for the T2 daemon.
# Edit, then `systemctl --user restart t2d` (or restart the tmux session).

listen_host: 0.0.0.0
ports: [12345, 12346, 12347, 12348, 12349, 12350, 12351, 12352]
coalesce_s: 0.75
db: /mnt/nvme5/casm_pipeline/db/t2.sqlite

# Set true (or run with --shadow) for a full dry-run: clusters, names, DB
# rows and trigger decisions, but no dump commands and no trigger cards.
shadow: false

# COMMISSIONING KILL-SWITCH (2026-07-31: the telescope is commissioning, so
# this ships FALSE). false = run the whole chain and record every trigger
# decision in the triggers table with action 'suppressed_commissioning', but
# send no dump command and write no trigger card. Same suppression as
# `shadow`, kept as a separate key so the dry-run flag stays available and
# the audit rows say WHY the dump did not happen. Flip to true to arm.
dumps_enabled: true   # armed 2026-08-13 per Vishnu (IB-sub-off restart); voltage below stays false

# STORM DEFENCES (2026-07-31, after t2d wedged three times). A candidate
# storm delivered up to 80,000 trials in one coalesced gulp (8 jobs x 10k
# cap); DBSCAN then took 83-137 s against the 8.7 s real-time budget and
# ingest stalled, back-pressuring the DAQ. Both knobs shed load before
# clustering and are counted per gulp in gulp_stats (n_vetoed, n_shed).

# Boxcar width indices dropped at PARSE time, before the fast path and the
# trigger-card context see them. Index 6 (the 67 ms boxcar) is 97-98.6% of
# everything stored on a quiet day: red-noise junk at DM >= 200 that
# clusters into nothing and triggers nothing. Empty list = disabled.
# Widening this throws away real data — check n_vetoed before and after.
veto_widths: [6]

# Hard bound on what reaches DBSCAN, applied when a coalesced gulp exceeds
# this many candidates (after the width veto). Two stages:
#   1. each global beam keeps its top ceil(cap/64) by S/N — handles RFI
#      concentrated in a few beams, and keeps the shed fair across the sky;
#   2. if that still exceeds the cap, keep the global top `cap` by S/N plus
#      every populated beam's top 4, so a bright storm elsewhere can never
#      evict a real single-beam FRB.
# Stage 2 exists because stage 1 alone allows quota x populated beams
# (313 x 512 = 160k here) and so did nothing for the 2026-07-31 storm, which
# was width-0 spikes spread across every beam. Worst case kept is
# cap + 4 x 512 ~ 22k. 0 disables the cap entirely.
max_cands_per_gulp: 20000

# 2026-08-13 (Vishnu): a gulp over the cap is dropped WHOLE instead of shed
# to the two-stage bound — during a storm the gulp is junk; skip it and stay
# real-time. Costs any real FRB that lands inside a storm gulp (the cap's
# per-beam floor used to preserve those); flip back to false to shed instead.
storm_skip_gulp: true

cluster:
  eps: 1.0
  min_samples: 5
  samp_scale: 64.0      # samples (~67 ms)
  dm_idx_scale: 32.0    # DM trials (~12 pc/cc)
  width_scale: 2.0      # log2(width) steps
  beam_scale: 4.0       # adjacent beams

tiers:                  # peak-SNR thresholds
  A: 30.0
  B: 18.0               # 2026-06-15: raised 13->18 for the 11-antenna array.
                        # The reduced aperture floods tier B with marginal
                        # S/N 13-15 noise (uniform across beams + DM, diurnal);
                        # at this rate B>=15 still ~470 eligible/day (> the 300
                        # cap), B>=18 ~120/day. (was TEMP-13 since 06-12, itself
                        # down from 15.) Lower back toward 13-15 as antennas
                        # are recovered.
  C: 12.0               # also the DB storage floor (T1 itself reports down to S/N 10)

filters:
  beam_veto: [2]        # RFI hotspot. (beam-64 veto removed 2026-06-12
                        # after the railed N21-E3 input was zeroed from the
                        # weights — the first-beam artifact died with it)
  max_nbeam: 32         # wider clusters are tagged rfi_wide, never trigger
  dm_floor: 20.0        # blind (tier) triggers require peak DM >= this

# DISK SAFETY: dumps are scarce on purpose. Caps are global across reasons.
trigger:
  # cluster-first (strict T2) since 2026-06-11: every dump decision waits
  # for DBSCAN; ring-window misses are recorded, not dodged.
  fast_path: false
  pre_s: 2.0
  post_s: 2.0
  # 2026-08-13 (Vishnu): blind triggers need 30 s of blind-eligible QUIET.
  # Every eligible blind event restarts the clock (dumped or not), so an RFI
  # storm gets one dump then locks out until it ends — min_spacing_s alone
  # would let a storm take a dump every 60 s for its whole duration.
  # Known-source triggers (B0329) are exempt. 0 disables.
  storm_lockout_s: 30
  disk_floor_gb: 200    # refuse any dump if target fs has less free
  intensity:
    # No rate gate: every T2-passed candidate is dumped, plotted, and its
    # .dada deleted (plotter --delete-dumps). The spacing only prevents
    # overlapping dump writes; daily_max is a runaway-storm backstop.
    min_spacing_s: 60
    daily_max: 300
  voltage:
    enabled: false      # flip to true to enable voltage dumps (tier A only)
    tier: A
    min_spacing_s: 600
    daily_max: 2

# Known sources trigger below the blind tiers (their own snr_min), matched
# by transit schedule + DM-RANGE overlap (never peak DM).
known_sources:
  - name: B0329+54
    dm_min: 25.0
    dm_max: 29.0
    snr_min: 11.0
    schedule_csv: /mnt/nvme5/casm_pipeline/schedules/b0329_schedule.csv
    schedule_pad_s: 120

context:                # T1 neighbourhood embedded in trigger cards
  window_s: 4.0
  delay_s: 8.0
  max_members: 3000

# t2-inject: scheduled live injections (corr1 streams only for now).
# Ledger rows are written before the FIFO write; t2d tags matching clusters
# 'injection' and never dumps them. Gates reconcile ~3 min after each shot.
injection:
  cadence_min: 120
  streams: [0, 1, 2, 3]
  dm_range: [100.0, 1000.0]
  amp_range: [25.0, 45.0]
  sigma_ms_range: [1.0, 67.0]   # up to hella's widest boxcar (64 samp ~ 67 ms)
  scratch_dir: /mnt/nvme5/casm_pipeline/injections
