# t2d config. Edit, then `systemctl --user restart t2d`.

listen_host: 0.0.0.0
ports: [12345, 12346, 12347, 12348, 12349, 12350, 12351, 12352]

# Gulp coalescing: flush when all coalesce_jobs jobs have reported and
# coalesce_s of quiet has passed, or at coalesce_max_s.
coalesce_s: 0.25        # s of quiet after the last batch
coalesce_jobs: 8        # jobs expected per gulp; defaults to len(ports)
coalesce_max_s: 8.0     # s, one gulp; short gulps are dropped whole (skipped=1)
db: /mnt/nvme5/casm_pipeline/db/t2.sqlite

shadow: false           # dry run: cluster and record, no dumps, no cards
dumps_enabled: true     # false: decide and record as suppressed_commissioning,
                        # send no dump command, write no card

veto_widths: [6]        # boxcar width indices dropped at parse time; [] disables
max_cands_per_gulp: 20000   # bound on what reaches DBSCAN; 0 disables
storm_skip_gulp: true   # true: drop a gulp over the cap whole, do not shed

cluster:
  eps: 1.0
  min_samples: 5
  samp_scale: 64.0      # samples (~67 ms)
  dm_idx_scale: 32.0    # DM trials (~12 pc/cc)
  width_scale: 2.0      # log2(width) steps
  # Sky link scales, degrees. Fallback only: t2d prefers the beam ellipse
  # stored on the live weights product.
  beam_fwhm_x_deg: 18.1   # E-W
  beam_fwhm_y_deg: 3.9    # N-S
  beam_scale: 4.0       # fallback beam-index axis, used with no pointing table

tiers:                  # peak-SNR thresholds
  A: 30.0
  B: 18.0               # below ~18 the 11-antenna array floods B with noise
  C: 12.0               # also the DB storage floor

filters:
  beam_veto: [2]        # RFI hotspot beams
  max_nbeam: 32         # more distinct beams: rfi_wide, never triggers
  max_sky_extent_deg: 25.0  # deg of member-beam span: rfi_wide; 0 disables
  dm_floor: 20.0        # pc/cc, blind triggers require peak DM >= this
  # Clusters at hella's first DM trial with a wide boxcar are zero-DM
  # impulses: tagged dm_floor, stored, never trigger. max_dm_lo 0 disables.
  dm_floor_veto:
    max_dm_lo: 20.6     # pc/cc
    min_width: 4        # boxcar width index

# Multi-beam coincidence on raw candidates: tag occupancy:<n>, never trigger.
occupancy:
  min_beams: 8          # distinct beams; 0 disables
  window_samp: 256      # +-0.27 s at 1.048576 ms

trigger:
  fast_path: false      # false: strict cluster-first, dump only after DBSCAN
  pre_s: 2.0
  post_s: 2.0
  storm_lockout_s: 300  # s of blind-eligible quiet a blind trigger needs;
                        # known sources exempt, 0 disables
  disk_floor_gb: 200    # refuse any dump if the target fs has less free
  intensity:
    min_spacing_s: 60   # prevents overlapping dump writes
    daily_max: 300      # runaway-storm backstop
  voltage:
    enabled: false      # tier A only
    tier: A
    min_spacing_s: 600
    daily_max: 2

# Known sources trigger on their own snr_min, below the blind tiers, matched by
# transit schedule plus DM-range overlap.
known_sources:
  - name: B0329+54
    dm_min: 25.0
    dm_max: 29.0
    snr_min: 11.0
    schedule_csv: /mnt/nvme5/casm_pipeline/schedules/b0329_schedule.csv
    schedule_pad_s: 120

context:                # T1 neighbourhood embedded in trigger cards
  window_s: 4.0
  delay_s: 8.0
  max_members: 3000

# t2-inject: scheduled live injections. Ledger rows are written before the FIFO
# write; t2d tags matching clusters 'injection' and never dumps them.
injection:
  cadence_min: 60
  streams: [0, 1, 2, 3]
  # One entry per drawn quantity: {dist: uniform|loguniform|choice|fixed, ...},
  # lo/hi for ranges, values (+ weights) for choice, value for fixed. CLI flags
  # override. dm: pc/cc, clamped to [0, 1000]. fwhm_ms: ms, log-uniform, keep
  # <= 30 so hella reports ibox <= 5 (ibox 6 is vetoed); < 2.469 clamps up.
  # inject_snr: true analytic S/N, not what hella reports.
  sample:
    dm:         {dist: uniform,    lo: 100.0, hi: 900.0}
    fwhm_ms:    {dist: loguniform, lo: 2.5,   hi: 30.0}
    inject_snr: {dist: loguniform, lo: 15.0,  hi: 18.0}
  summary_dm_bins: [100.0, 300.0, 500.0, 700.0, 900.0]   # daily summary tally
  # Cap on the predicted hella-reported S/N; above it the injected S/N is
  # scaled down. Flat to mid_max_ms, then wide_base*sqrt(wide_ref_ms/FWHM).
  reported_snr_cap:
    narrow: 50.0            # FWHM below narrow_max_ms
    narrow_max_ms: 6.0
    mid: 40.0               # FWHM narrow_max_ms to mid_max_ms
    mid_max_ms: 15.0
    wide_base: 40.0
    wide_ref_ms: 12.0
  # hella-reported S/N over the analytic matched-filter S/N, [fwhm_ms, ratio],
  # for IB subtraction on.
  rec_per_true_table:
    - [4.7, 1.40]             # scaled from the sub-OFF sweep, not measured
    - [11.8, 1.30]            # measured, 4 shots
    - [23.5, 0.77]            # scaled from the sub-OFF sweep, not measured
  rec_per_true: 1.30          # fallback when rec_per_true_table is absent
  # Live-std guard after a beamformer restart: Redis keeps the last published
  # value, so wait for it to change or skip the shot as fire_failed.
  max_std_age_s: 30.0         # s since restart below which the guard applies
  std_wait_s: 120.0           # s to wait for a new value before giving up
  std_poll_s: 5.0             # s between reads
  nchan_usable: 2600          # 3072 minus the 472-channel 470-484 MHz mask
  amp_floor: 4                # counts; u8 truncation costs >20% of the S/N below this
  std_bandpass_factor: 1.4    # Redis std over per-channel std in band (1.33-1.47 measured)
  amp_range: [25.0, 45.0]     # stream counts
  reconcile_wait_s: 90        # s after the FIFO write before reconciling
  # Replay: dump the injected stream, render it with the pulse, thread the PNG
  # under the shot's Slack message. Window is [inject_utc - dump_pre_s,
  # inject_utc - dump_post_s]: the pulse lands before inject_utc.
  replay:
    post: never               # always | daily | on_miss | never
    dump_pre_s: 24            # s before inject_utc, window start
    dump_post_s: 10           # s before inject_utc, window end before the sweep
    dump_sweep_margin_s: 2    # s added after the DM sweep, for the pulse width
    dump_timeout_s: 60        # s floor; the wait scales as 2 x window_s
    keep_dump: false          # keep the .dada after plotting
    on_miss: none             # none: render nothing | expected: pulse where due
    keep_dump_on_miss: true
    events_root: /mnt/nvme3/T3/EVENTS
    command: /home/casm/software/dev/casm_venvs/casm_offline_env/bin/t3-replay-injection
  scratch_dir: /mnt/nvme5/casm_pipeline/injections
  # Slack. Token and channel come from ~/.config/slack_api and
  # ~/.config/slack_channel, with ~/.config/slack_channel_injections overriding
  # the channel. Preview offline with t2-inject-slack-preview.
  slack:
    enabled: true
    mode: sent_then_update    # sent_then_update | single | sent_then_edit
    summary_figures: false    # build the injected-vs-recovered S/N figure
    dry_run_dir: null         # path: write .txt per message, open no socket
    channel: null             # overrides the dotfiles
    streak_every: 5           # attention message per N consecutive misses
    web_base: http://127.0.0.1:8050   # t3 web app, for the recovered link

# Beam pointings for cluster rows and trigger cards, maintained by
# deploy_bf_weights and t3-weights-watch.
weights_registry: /mnt/nvme5/casm_pipeline/weights/registry
